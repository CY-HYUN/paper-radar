# Lint config for ruff (the harness lint hook runs `ruff check` on edited .py files only when this file exists).
# line-length matches the code as written (p99 155 chars on 2026-10-06), so `ruff format` does not rewrap it.
line-length = 160
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F"]
